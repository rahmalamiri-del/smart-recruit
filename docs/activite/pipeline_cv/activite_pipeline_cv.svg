ill="#FEFFDD"/><path d="M845.394,413.951 L845.394,434.784 L866.227,434.784 L845.394,413.951" style="stroke:#181818;stroke-width:1.042;" fill="#FEFFDD"/><text x="515.397" y="447.817" fill="#000" font-size="25" textLength="259.839" font-family="Arial">Repli local en PHP si le</text><text x="515.397" y="476.565" fill="#000" font-size="25" textLength="319.58" font-family="Arial">microservice est indisponible</text><rect x="33.333" y="403.534" width="427.897" height="99.162" fill="#F4F7FB" style="stroke:#1F3A5F;stroke-width:1.042;" rx="26.042" ry="26.042"/><text x="54.167" y="447.817" fill="#000" font-size="25" textLength="386.23" font-family="Arial">Extraire le texte via le microservice</text><text x="54.167" y="476.565" fill="#000" font-size="25" textLength="227.832" font-family="Arial">(pdfminer / PyPDF2)</text><rect x="907.894" y="403.534" width="329.313" height="70.414" fill="#F4F7FB" style="stroke:#1F3A5F;stroke-width:1.042;" rx="26.042" ry="26.042"/><text x="928.727" y="447.817" fill="#000" font-size="25" textLength="287.646" font-family="Arial">Lire le texte brut du fichier</text><polygon points="659.916,515.196,684.916,540.196,659.916,565.196,634.916,540.196,659.916,515.196" fill="#E8EEF6" style="stroke:#1F3A5F;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="411.91" y="606.862" width="496.012" height="99.162" fill="#F4F7FB" style="stroke:#1F3A5F;stroke-width:1.042;" rx="26.042" ry="26.042"/><text x="432.743" y="651.145" fill="#000" font-size="25" textLength="182.031" font-family="Arial">Nettoyer le texte</text><text x="432.743" y="679.893" fill="#000" font-size="25" textLength="454.346" font-family="Arial">(caractères parasites, espaces multiples)</text><rect x="431.685" y="747.691" width="456.462" height="99.162" fill="#F4F7FB" style="stroke:#1F3A5F;stroke-width:1.042;" rx="26.042" ry="26.042"/><text x="452.519" y="791.974" fill="#000" font-size="25" textLength="289.026" font-family="Arial">Détecter les compétences</text><text x="452.519" y="820.721" fill="#000" font-size="25" textLength="414.795" font-family="Arial">(alias + taxonomie des compétences)</text><rect x="437.972" y="888.519" width="443.888" height="127.909" fill="#F4F7FB" style="stroke:#1F3A5F;stroke-width:1.042;" rx="26.042" ry="26.042"/><text x="458.805" y="932.802" fill="#000" font-size="25" textLength="377.161" font-family="Arial">Extraire l'expérience, la formation,</text><text x="458.805" y="961.55" fill="#000" font-size="25" textLength="315.442" font-family="Arial">les e-mails et les téléphones</text><text x="458.805" y="990.297" fill="#000" font-size="25" textLength="402.222" font-family="Arial">(expressions régulières + mots-clés)</text><rect x="367.397" y="1058.095" width="585.038" height="99.162" fill="#F4F7FB" style="stroke:#1F3A5F;stroke-width:1.042;" rx="26.042" ry="26.042"/><text x="388.23" y="1102.378" fill="#000" font-size="25" textLength="387.695" font-family="Arial">Construire les données structurées</text><text x="388.23" y="1131.126" fill="#000" font-size="25" textLength="543.372" font-family="Arial">(fusion avec les données saisies, sans doublons)</text><rect x="412.935" y="1198.924" width="493.962" height="99.162" fill="#F4F7FB" style="stroke:#1F3A5F;stroke-width:1.042;" rx="26.042" ry="26.042"/><text x="433.769" y="1243.207" fill="#000" font-size="25" textLength="284.924" font-family="Arial">Sauvegarder les données</text><text x="433.769" y="1271.954" fill="#000" font-size="25" textLength="452.295" font-family="Arial">(sr_cv_documents + sr_student_profiles)</text><rect x="442.47" y="1339.752" width="434.892" height="70.414" fill="#F4F7FB" style="stroke:#1F3A5F;stroke-width:1.042;" rx="26.042" ry="26.042"/><text x="463.304" y="1384.035" fill="#000" font-size="25" textLength="393.225" font-family="Arial">Afficher le profil candidat pré-rempli</text><rect x="425.1" y="1553.707" width="469.633" height="99.162" fill="#F4F7FB" style="stroke:#1F3A5F;stroke-width:1.042;" rx="26.042" ry="26.042"/><text x="445.933" y="1